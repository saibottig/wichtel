<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wichteln</title>
    <meta name="description" content="Ein Buchstabe und eine Farbe pro Jahr, ausgelost für die ganze Gruppe." />
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>"
    />
  </head>
  <body>
    <div class="grund-schichten" aria-hidden="true">
      <div class="grund-farbe" id="grund-farbe"></div>
      <div class="grund-muster" id="grund-muster"></div>
      <div class="grund-schleier"></div>
    </div>

    <main class="buehne">
      <section id="bereich-ergebnis" class="zustand" hidden>
        <p class="pille"><span id="ergebnis-jahr"></span></p>
        <p class="riese" id="ergebnis-buchstabe">?</p>
        <p class="wort" id="ergebnis-farbname"></p>
        <p class="satz" id="ergebnis-regel" role="status"></p>
        <div class="knopfreihe">
          <button type="button" class="knopf knopf-haupt" id="knopf-kopieren">Link kopieren</button>
          <button type="button" class="knopf knopf-still" id="knopf-neu">Neu auslosen</button>
        </div>
        <p class="hinweis" id="kopier-rueckmeldung" role="status"></p>
      </section>

      <section id="bereich-auslosung" class="zustand" hidden>
        <p class="pille"><span id="auslosung-jahr"></span></p>
        <p class="riese riese-leer">?</p>
        <p class="wort">Noch nichts gezogen</p>
        <p class="satz">Ein Buchstabe und eine Farbe, für die ganze Gruppe.</p>
        <div class="knopfreihe">
          <button type="button" class="knopf knopf-haupt knopf-gross" id="knopf-auslosen">
            Auslosen
          </button>
        </div>
      </section>

      <section id="bereich-fehler" class="zustand" hidden>
        <p class="pille"><span id="fehler-jahr"></span></p>
        <p class="riese riese-leer">?</p>
        <p class="wort wort-fehler">Der Link lässt sich nicht lesen</p>
        <p class="satz">
          Wahrscheinlich ist er beim Weiterleiten abgeschnitten worden. Lost einfach neu aus.
        </p>
        <div class="knopfreihe">
          <button type="button" class="knopf knopf-haupt" id="knopf-fehler-auslosen">
            Neu auslosen
          </button>
        </div>
      </section>

      <section class="vergangenes" id="bereich-vergangenes" hidden>
        <h2 class="vergangenes-titel">Vergangene Jahre</h2>
        <ul class="jahresliste" id="jahresliste"></ul>
      </section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
